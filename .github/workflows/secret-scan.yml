# .github/workflows/secret-scan.yml
#
# Free, no-license secret scanning for org-owned private repos.
#
# Note: the official gitleaks/gitleaks-action@v2 now requires a paid
# license (or a free-tier registration that issues GITLEAKS_LICENSE)
# for any repository owned by a GitHub organization. To stay
# dependency-free we invoke the gitleaks CLI directly; the CLI itself
# is Apache-2.0 and has no licensing requirement.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"  # nightly full-history scan

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -eu
          GITLEAKS_VERSION="8.21.2"
          # From gitleaks_8.21.2_checksums.txt on the release: a swapped asset
          # fails here instead of running with the repository checked out.
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        shell: bash
        run: |
          set -eu
          # --redact prevents leaked secrets from being echoed back into
          # the build log (which would create another copy of the leak).
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
