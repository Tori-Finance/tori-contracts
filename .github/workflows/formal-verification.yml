name: Formal verification

# halmos symbolic execution over the `check_*` properties in test/halmos (see test/halmos/README.md).
# Each property is proven for every input within its documented bounds; a counterexample, a solver
# TIMEOUT or an internal ERROR fails the job. One matrix job per contract group keeps each under the
# job timeout and lets them run in parallel.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'foundry.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'halmos.toml'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'foundry.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'halmos.toml'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HALMOS_VERSION: 0.3.3

jobs:
  halmos:
    name: halmos (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # `tests` optionally narrows a job to part of a contract's properties (halmos --match-test);
        # empty means all of them. The strUSD vault and minting are each split in two to stay well inside
        # the timeout: a hosted runner is several times slower than a laptop (minting: 5 min locally, over
        # 25 min in one job).
        include:
          - group: trUSD
            contracts: '^TrUSDHalmos$'
            tests: ''
          - group: strUSD blacklist and access control
            contracts: '^StakedTrUSDHalmos$'
            tests: '^check_(blacklisted|owner|privileged|cooldown_bounded)'
          - group: strUSD cooldown, rescue and arithmetic
            contracts: '^(StakedTrUSDHalmos|StakedTrUSDMathHalmos)$'
            tests: '^check_(?!blacklisted|owner|privileged|cooldown_bounded)'
          - group: minting access control
            contracts: '^ToriMintingHalmos$'
            tests: '^check_(privilegedState|gatekeeper|custodiansAndTokens|admin|trUSDSupply)'
          - group: minting orders, caps and custody
            contracts: '^ToriMintingHalmos$'
            tests: '^check_(?!privilegedState|gatekeeper|custodiansAndTokens|admin|trUSDSupply)'
          - group: governance
            contracts: '^ToriTimelockHalmos$'
            tests: ''
          - group: PendleYTLock
            contracts: '^(PendleYTLockHalmos|PendleYTLockNoYieldHalmos)$'
            tests: ''
          - group: silo and distributor
            contracts: '^(TrUsdSiloHalmos|StakingRewardsDistributorHalmos)$'
            tests: ''
          - group: strUSD on other chains
            contracts: '^StakedTrUSDL2Halmos$'
            tests: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # forge-std is an npm git dependency pinned to a commit. npm records github git dependencies
      # as git+ssh in the lockfile; the runner has no SSH key, so fetch them over https.
      - name: Install npm dependencies (OpenZeppelin, Chainlink CCIP, forge-std)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci

      # Pinned: halmos reads forge's build output, so a Foundry release cannot change it underneath.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.9.2
        with:
          version: v1.4.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # halmos pins its own z3 and yices wheels; yices is the solver used.
      - name: Install halmos
        run: python -m pip install "halmos==${HALMOS_VERSION}"

      - name: Show versions
        run: |
          forge --version
          halmos --version

      # halmos runs its own `forge build --ast`. Do not restore a Forge build cache here: artifacts
      # built without the AST make halmos skip every contract.
      # halmos.toml supplies the property prefix, the loop bound and the per-query solver timeout.
      # halmos exits non-zero on any counterexample, TIMEOUT, ERROR or all-paths-reverted property.
      # A path cut by the loop bound only produces a warning, so the log is gated on it as well: a PASS
      # with dropped paths is not a proof.
      - name: Run halmos
        env:
          CONTRACTS: ${{ matrix.contracts }}
          TESTS: ${{ matrix.tests }}
        run: |
          set -o pipefail
          halmos --match-contract "$CONTRACTS" ${TESTS:+--match-test "$TESTS"} --no-status --json-output halmos.json 2>&1 | tee halmos.log
          if grep -q "loop unrolling bound" halmos.log; then
            echo "::error::halmos dropped paths at the loop bound; raise --loop for the property named above"
            exit 1
          fi

      - name: Keep halmos report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: halmos-${{ strategy.job-index }}
          path: |
            halmos.json
            halmos.log
          if-no-files-found: warn
          retention-days: 30
